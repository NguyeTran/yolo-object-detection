services:
  backend:
    build: 
      context: ./backend
    container_name: yolo_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=yolov8n.pt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend