services:
  # Backend
  - type: web
    name: yolo-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free

    envVars:
      - key: PORT
        value: 8000

    healthCheckPath: /health

  # Frontend
  - type: web
    name: yolo-frontend
    env: static
    buildCommand: cd frontend && npm install && VITE_API_BASE_URL=https://yolo-object-detection-bbe2.onrender.com npm run build
    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: yolo-backend
          envVarKey: RENDER_EXTERNAL_URL