services:
  # 1. Cấu hình Backend (AI YOLO & FastAPI)
  - type: web
    name: yolo-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8000
    healthCheckPath: /health

    # 2. Cấu hình Frontend (React / Vite)
  - type: web
    name: yolo-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: singapore
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: yolo-backend
          property: host