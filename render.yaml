services:
  # Backend service
  - type: web
    name: yolo-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 8000
    healthCheckPath: /health

  # Frontend service
  - type: web
    name: yolo-frontend
    env: static
    buildCommand: cd frontend && npm install && echo "API=$VITE_API_BASE_URL" && npm run build
    staticPublishPath: ./frontend/dist