name: Continuous Integration

on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. KIỂM TRA BACKEND VÀ CHẠY BÀI TEST AI
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Test Tools
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run AI Object Detection Test
        run: |
          cd backend
          # Chạy bài test ép tìm ra con chó trong sample_dog.jpg
          pytest test_main.py -v

  # 2. KIỂM TRA FRONTEND
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci  # Cài đặt các dependencies
          npm run build  # Đảm bảo code React không bị lỗi cú pháp
  
    # 3. Docker checks
  docker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: yolo-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: yolo-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend