name: CI Pipeline

on:
  # 1. Kích hoạt CI tự động mỗi khi bạn PUSH lên nhánh riêng
  push:
    branches: [ "feature/frontend-react-ui" ]
  
  # 2. Vẫn giữ lại dòng này để sau này tạo Pull Request vào main nó tự test lại lần cuối
  pull_request:
    branches: [ "main" ]    

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Tự động cache pip dependencies
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest flake8
      - name: Lint and Test
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Chạy pytest nếu bạn đã viết test case, tạm thời để echo
          echo "Running backend tests..." 

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Tests
        run: |
          cd frontend
          # Chạy npm test nếu có, tạm thời để echo
          echo "Running frontend tests..."

  docker-build-check:
    needs: [test-backend, test-frontend] # Chỉ chạy khi 2 job trên pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build test Backend
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false # Chỉ build để check lỗi Dockerfile, không push
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build test Frontend
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max