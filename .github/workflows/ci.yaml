name: Continuous Integration

on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. KIỂM TRA BACKEND VÀ CHẠY BÀI TEST AI
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Test Tools
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run AI Object Detection Test
        run: |
          cd backend
          # Chạy bài test ép tìm ra con chó trong sample_dog.jpg
          pytest test_main.py -v

  # 2. KIỂM TRA FRONTEND
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build  # Đảm bảo code React không bị lỗi cú pháp
